# LLMSwarm example configuration.
# Copy this file to swarm.toml, fill in your horde api_key and worker_id,
# and point the members at your own endpoints. swarm.toml is local-only
# (gitignored) so your key never lands in git.

[llama]
server_bin = "/path/to/llama.cpp/build/bin/llama-server"
boot_timeout = 600

[blackboard]
path = ".swarm/blackboard.sqlite"
retention_days = 0.0

[serve]
host = "0.0.0.0"
port = 5100
mode = "ensemble"          # ensemble = all enabled members answer, judge merges
reasoning = "off"          # default reasoning control: off | auto | on
member_timeout = 0.0       # per-member timeout for serve-mode fan-out (0 = off)
judge = "Hemmingway_Qwen-27B"

[horde]
cluster = "https://stablehorde.net"
api_key = ""               # your horde API key (required, keep it out of git)
name_prefix = "Swarm_Test" # prefix of the advertised model identifier
worker_id = ""             # your worker name as registered on the horde
poll_interval = 4.0        # seconds between job pops
max_length = 1024          # generation length offered to the master
max_context_length = 20480 # context offered to the master
concurrency = 0            # jobs processed in parallel (0/1 = one at a time)
# Hard wall-clock budget per horde job (s). We submit (faulted if needed)
# before this so the master never counts the job as dropped.
job_timeout = 120
# Seconds of that budget reserved for the judge merge step.
judge_reserve = 30
# Backup judge tried when the primary judge is busy/rate-limited (koboldcpp
# 503). If both judges fail, the longest raw member answer is submitted
# directly - the job still earns kudos and is never faulted.
alt_judge = ""
quiet = true               # suppress per-request debug output

# Members are connect-only remote endpoints (koboldcpp / llama.cpp servers).
# The url is the identity; the name is display + part of the horde model id.
# Members are connect-only remote endpoints (koboldcpp / llama.cpp servers).
# The url is the identity; the name is display + part of the horde model id.
# role: worker   - generates answers (horde jobs + ensemble fan-out)
#       judge    - only merges candidate answers, never generates
#       alt_judge- backup judge, tried when the primary judge is busy/503
#       planner  - leads the swarm-mode pipeline (ask --mode swarm)
# Dedicated judges keep the generation fan-out free (faster submits) and avoid
# the koboldcpp 503 self-collision of a judge that just generated.
[[member]]
name = "Hemmingway_Qwen-27B"
url = "http://192.168.1.101:5001"
temperature = 0.7
enabled = true
reasoning = "auto"
reasoning_style = "chat_template_kwargs"
role = "judge"

[[member]]
name = "Xotron-V4_Qwen-27B"
url = "http://192.168.1.101:5002"
temperature = 0.7
enabled = true
reasoning = "auto"
reasoning_style = "chat_template_kwargs"

